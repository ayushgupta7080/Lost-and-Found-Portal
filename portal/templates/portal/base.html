<!-- portal/templates/portal/base.html -->
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>{% block title %}Lost & Found{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'portal/css/style.css' %}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="{% url 'home' %}">Lost & Found</a>
    <div class="d-flex">
      <a class="btn btn-outline-light me-2" href="{% url 'post_lost_item' %}">Report Lost</a>
      <a class="btn btn-outline-light me-3" href="{% url 'post_found_item' %}">Report Found</a>
      {% if user.is_authenticated %}
        <a class="btn btn-light me-2" href="{% url 'profile' %}">Profile</a>
        <a class="btn btn-danger" href="{% url 'logout' %}">Logout</a>
      {% else %}
        <a class="btn btn-success me-2" href="{% url 'login' %}">Login</a>
        <a class="btn btn-warning" href="{% url 'register' %}">Register</a>
      {% endif %}
    </div>
  </div>
</nav>
<div class="container">
  {% block content %}{% endblock %}
</div>
</body>
</html>

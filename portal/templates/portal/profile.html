<!-- portal/templates/portal/profile.html -->
{% extends 'portal/base.html' %}
{% block title %}Profile{% endblock %}
{% block content %}
<h3>My Profile</h3>
<form method="post" enctype="multipart/form-data">
  {% csrf_token %}
  {{ form.as_p }}
  <button class="btn btn-primary" type="submit">Save</button>
</form>
{% endblock %}
